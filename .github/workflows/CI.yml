name: CI

on:
  push:
    branches:
      - main
      - TimelikeReconstruction
  pull_request:
  workflow_dispatch:

jobs:
  load:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
      - name: Load package
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); using KerrGeodesics'
